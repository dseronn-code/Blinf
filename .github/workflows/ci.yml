name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Rodar também os testes E2E (Playwright) — mais lentos'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://gestaopro:gestaopro@localhost:5432/gestaopro?schema=public
  NEXTAUTH_SECRET: ci-secret-gestaopro
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestaopro
          POSTGRES_PASSWORD: gestaopro
          POSTGRES_DB: gestaopro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gestaopro" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrações
        run: npx prisma migrate deploy
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Dados de demonstração (seed)
        run: npm run db:seed
      - name: Testes com banco (Vitest, RUN_DB_TESTS=1)
        run: npm run test:db
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    # Lento: roda só quando disparado manualmente (Actions → CI → Run workflow)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestaopro
          POSTGRES_PASSWORD: gestaopro
          POSTGRES_DB: gestaopro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gestaopro" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Sobe o servidor (next start)
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:3000/login > /dev/null && exit 0; sleep 2; done
          cat server.log; exit 1
      - name: Testes E2E
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            server.log
          retention-days: 7
